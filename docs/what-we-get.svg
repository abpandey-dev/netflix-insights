<rect x="768" y="258" width="191.9" height="28" rx="4" fill="#2563EB"/>
<text x="949.935" y="277" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">16.7%</text>
<text x="628" y="334" font-size="13" fill="#334155">Audience behaviour predicts viewing; genre</text>
<text x="628" y="356" font-size="13" fill="#334155">similarity alone barely does. Content still</text>
<text x="628" y="378" font-size="13" fill="#334155">helps with brand-new titles nobody has seen.</text>
<rect x="24" y="458" width="276" height="182" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="44" y="504" font-size="34" fill="#1D4ED8" font-weight="800">22%</text>
<text x="44" y="534" font-size="14" fill="#0F172A" font-weight="700">of views go to the top 1%</text>
