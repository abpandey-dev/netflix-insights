<text x="756" y="189" font-size="13" fill="#334155" text-anchor="end">Content</text>
<rect x="768" y="170" width="230" height="28" rx="4" fill="#F1F5F9"/>
<rect x="768" y="170" width="26.8" height="28" rx="4" fill="#94A3B8"/>
<text x="802.795" y="189" font-size="13" fill="#334155" font-weight="700">2.3%</text>
