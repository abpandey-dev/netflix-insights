<text x="336" y="534" font-size="14" fill="#0F172A" font-weight="700">of peak by week 4 (films)</text>
<text x="336" y="558" font-size="12" fill="#475569">series still hold 31%; most</text>
<text x="336" y="576" font-size="12" fill="#475569">titles peak in their first</text>
<text x="336" y="594" font-size="12" fill="#475569">chart week</text>
<rect x="608" y="458" width="276" height="182" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="628" y="504" font-size="34" fill="#15803D" font-weight="800">0.86</text>
<text x="628" y="534" font-size="14" fill="#0F172A" font-weight="700">Germany-Austria taste overlap</text>
<text x="628" y="558" font-size="12" fill="#475569">India&#x27;s twin: Bangladesh (0.67)</text>
<text x="628" y="576" font-size="12" fill="#475569">Japan is the most distinct:</text>
<text x="628" y="594" font-size="12" fill="#475569">best match only 0.22</text>
<rect x="900" y="458" width="276" height="182" rx="14" fill="#FAF5FF" stroke="#E9D5FF"/>
<text x="920" y="504" font-size="34" fill="#6E56CF" font-weight="800">67 wks</text>
