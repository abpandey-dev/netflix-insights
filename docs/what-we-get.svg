<rect x="768" y="214" width="184.5" height="28" rx="4" fill="#94A3B8"/>
<text x="942.46" y="233" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">16.0%</text>
<text x="756" y="277" font-size="13" fill="#0F172A" font-weight="700" text-anchor="end">Collaborative</text>
